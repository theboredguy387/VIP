<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lunar — Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #0d0f12;
      --surface:   #13161b;
      --border:    #1f2530;
      --border-hi: #2e3a4a;
      --text:      #c8d4e0;
      --text-dim:  #4e6070;
      --text-hi:   #e8f0f8;
      --accent:    #3b8ae6;
      --accent-hi: #5ba0f0;
      --code-bg:   #0a0c10;
      --red:       #e05a5a;
      --green:     #4ec98a;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', system-ui, sans-serif;
      box-sizing: border-box;
      padding-top:    env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    #app { display: flex; height: 100%; }

    #sidebar {
      width: 240px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #sidebar-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    .logo-mark {
      width: 24px;
      height: 24px;
      background: var(--accent);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      color: #fff;
    }

    #new-chat-btn {
      background: var(--accent);
      border: none;
      color: #fff;
      border-radius: 5px;
      padding: 5px 10px;
      font-family: var(--mono);
      font-size: 11px;
      cursor: pointer;
      flex-shrink: 0;
    }

    #new-chat-btn:hover { background: var(--accent-hi); }

    #chats-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    #chats-list::-webkit-scrollbar { width: 5px; }
    #chats-list::-webkit-scrollbar-track { background: transparent; }
    #chats-list::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 3px; }

    .chat-item {
      padding: 8px 10px;
      margin-bottom: 4px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all .15s;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      overflow: hidden;
    }

    .chat-item:hover {
      border-color: var(--accent);
      background: var(--surface);
    }

    .chat-item.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .chat-item-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-item-actions {
      display: none;
      gap: 4px;
      flex-shrink: 0;
    }

    .chat-item:hover .chat-item-actions {
      display: flex;
    }

    .action-btn {
      width: 18px;
      height: 18px;
      background: var(--border-hi);
      border: none;
      border-radius: 3px;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .action-btn:hover { background: var(--red); color: #fff; }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 14px 20px 13px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-text { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--text-hi); }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px 20px;
    }

    #chat::-webkit-scrollbar { width: 5px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 3px; }

    #empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      text-align: center;
    }

    #empty .big-mark {
      width: 54px;
      height: 54px;
      background: var(--accent);
      opacity: .15;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 600;
      color: var(--accent);
    }

    #empty h2 { font-family: var(--mono); font-size: 14px; color: var(--text-hi); }
    #empty p { font-size: 13px; color: var(--text-dim); max-width: 320px; }

    .msg {
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    .msg:last-child { border-bottom: none; }

    .avatar {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
    }

    .avatar.user { background: var(--border-hi); color: var(--text); }
    .avatar.ai { background: var(--accent); color: #fff; }

    .msg-body { flex: 1; min-width: 0; }
    .msg-role { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); margin-bottom: 4px; }
    .msg.ai .msg-role { color: var(--accent); }

    .msg-content {
      font-size: 13.5px;
      color: var(--text);
      line-height: 1.7;
      word-break: break-word;
    }

    .msg-content p { margin-bottom: .7em; }
    .msg-content p:last-child { margin-bottom: 0; }
    .msg-content h1, .msg-content h2, .msg-content h3 {
      font-family: var(--mono);
      color: var(--text-hi);
      margin: 1em 0 .5em;
      font-weight: 500;
      font-size: 14px;
    }

    .msg-content strong { color: var(--text-hi); font-weight: 500; }
    .msg-content em { font-style: italic; }
    .msg-content ul, .msg-content ol { padding-left: 1.4em; margin-bottom: .7em; }
    .msg-content li { margin-bottom: .3em; }

    .msg-content code {
      font-family: var(--mono);
      font-size: 12px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 1px 5px;
      color: var(--accent-hi);
    }

    .msg-content pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
      margin: .8em 0;
      overflow-x: auto;
      position: relative;
    }

    .msg-content pre code { background: none; border: none; padding: 0; color: var(--text); font-size: 12px; }

    .code-wrap { position: relative; }
    .copy-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 10px;
      padding: 2px 7px;
      cursor: pointer;
      opacity: 0;
    }

    .code-wrap:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { color: var(--text-hi); border-color: var(--border-hi); }
    .copy-btn.copied { color: var(--green); opacity: 1; }

    .cursor::after { content: '▋'; color: var(--accent); animation: blink .7s step-end infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    footer {
      border-top: 1px solid var(--border);
      background: var(--bg);
      padding: 14px 20px;
    }

    .input-row { display: flex; gap: 8px; align-items: flex-end; }

    #msg-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-hi);
      font-family: var(--sans);
      font-size: 13.5px;
      padding: 10px 14px;
      resize: none;
      min-height: 42px;
      max-height: 180px;
      field-sizing: content;
    }

    #msg-input:focus { outline: none; border-color: var(--accent); }
    #msg-input::placeholder { color: var(--text-dim); }

    #send-btn {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s;
    }

    #send-btn:hover:not(:disabled) { background: var(--accent-hi); }
    #send-btn:disabled { background: var(--border); cursor: not-allowed; }
    #send-btn.stop { background: var(--red); }
    #send-btn.stop:hover { background: #e87070; }

    #modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    #modal.show { display: flex; }

    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border-hi);
      border-radius: 10px;
      padding: 20px;
      max-width: 400px;
      box-shadow: 0 10px 40px rgba(0,0,0,.5);
    }

    .modal-title { font-family: var(--mono); font-size: 14px; color: var(--text-hi); margin-bottom: 12px; }
    .modal-text { font-size: 13px; color: var(--text-dim); margin-bottom: 18px; }

    .modal-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-hi);
      font-family: var(--sans);
      font-size: 13px;
      padding: 8px 12px;
      margin-bottom: 14px;
    }

    .modal-input:focus { outline: none; border-color: var(--accent); }

    .modal-buttons { display: flex; gap: 8px; }
    .modal-btn {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      cursor: pointer;
    }

    .modal-btn:hover { border-color: var(--accent); color: var(--text-hi); }
    .modal-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .modal-btn.primary:hover { background: var(--accent-hi); }
    .modal-btn.danger { color: var(--red); }
    .modal-btn.danger:hover { border-color: var(--red); }

    @media (max-width: 768px) {
      #sidebar { width: 180px; }
      header { padding: 10px 14px; }
      #chat { padding: 0 14px 16px; }
      footer { padding: 10px 14px; }
    }
  </style>
</head>

          </svg>
        </button>
      </div>
    </footer>
  </div>
</div>

<div id="modal">

</div>

const sidebarEl = document.getElementById('sidebar');

// Load chats from localStorage
function loadChats() {
  const stored = localStorage.getItem('lunar-chats');
  if (stored) {
    chats = JSON.parse(stored);
  } else {
    chats = {};
  }
  
  if (Object.keys(chats).length === 0) {
    newChat();
  } else {
    currentChatId = localStorage.getItem('lunar-current-chat') || Object.keys(chats)[0];
  }
  
  renderChatsList();
  loadChat(currentChatId);
}

// Save chats to localStorage
function saveChats() {
  localStorage.setItem('lunar-chats', JSON.stringify(chats));
  localStorage.setItem('lunar-current-chat', currentChatId);
}

// Create new chat
function newChat() {
  const id = Date.now().toString();
  chats[id] = {
    id,
    name: 'New chat',
    messages: [{ role: 'system', content: SYSTEM_PROMPT }],
    created: new Date().toISOString()
  };
  currentChatId = id;
  saveChats();
  renderChatsList();
  loadChat(id);
}

// Load chat
function loadChat(id) {
  currentChatId = id;
  renderChatsList();

}

// Render chats list
function renderChatsList() {
  chatsListEl.innerHTML = '';
  
  for (const id of Object.keys(chats).sort((a, b) => chats[b].created - chats[a].created)) {
    const chat = chats[id];
    const item = document.createElement('div');
    item.className = 'chat-item' + (id === currentChatId ? ' active' : '');
    
    const name = document.createElement('div');
    name.className = 'chat-item-name';
    name.textContent = chat.name;
    
    const actions = document.createElement('div');

    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
    
    item.appendChild(name);
    item.appendChild(actions);
    item.onclick = () => loadChat(id);
    
    chatsListEl.appendChild(item);
  }
}

        else loadChat(currentChatId);
      }
      saveChats();
      renderChatsList();
    }
  });
}

// Modal
function showModal(opts) {
  const title = document.getElementById('modal-title');
  const text = document.getElementById('modal-text');
  const input = document.getElementById('modal-input');
  const confirm = document.getElementById('modal-confirm');
  const cancel = document.getElementById('modal-cancel');
  
  title.textContent = opts.title;
  text.textContent = opts.text || '';
  input.value = opts.input || '';
  input.style.display = opts.input !== '' ? 'block' : 'none';
  
  confirm.textContent = opts.isDangerous ? 'delete' : 'ok';
  confirm.className = 'modal-btn primary' + (opts.isDangerous ? ' danger' : '');
  
  confirm.onclick = () => {
    modalEl.classList.remove('show');
    if (opts.onConfirm) opts.onConfirm(input.value);
  };
  
  cancel.onclick = () => modalEl.classList.remove('show');
  
  modalEl.classList.add('show');
  input.focus();
}

// Render chat messages
function renderChat() {
  if (!currentChatId || !chats[currentChatId]) return;
  
  const chat = chats[currentChatId];
  chatEl.innerHTML = '';
  
  const msgs = chat.messages.filter(m => m.role !== 'system');
  
  if (msgs.length === 0) {
    chatEl.innerHTML = '<div id="empty"><div class="big-mark">L</div><h2>Lunar</h2><p>start typing</p></div>';
    return;
  }
  
  for (const msg of msgs) {
    renderMessage(msg, false);
  }
}

// Submit message
sendBtn.addEventListener('click', () => { if (isStreaming) stopStream(); else submit(); });
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!isStreaming) submit(); }
});

async function submit() {
  const text = inputEl.value.trim();
  if (!text || !currentChatId) return;
  
  const chat = chats[currentChatId];
  const empty = document.getElementById('empty');
  if (empty) empty.remove();
  
  chat.messages.push({ role: 'user', content: text });
  renderMessage({ role: 'user', content: text }, false);
  inputEl.value = '';
  
  const { contentEl } = renderMessage({ role: 'assistant', content: '' }, true);
  setStreaming(true);
  controller = new AbortController();
  
  try {
    const res = await fetch('https://tokenharbor.ai/v1/chat/completions', {
      method: 'POST',
      signal: controller.signal,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + API_KEY
      },
      body: JSON.stringify({
        model: 'deepseek-v4.1-flash:free',
        stream: true,
        max_tokens: 8192,
        messages: chat.messages
      })
    });
    
    if (!res.ok) throw new Error('HTTP ' + res.status);
    
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '', full = '';
    
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      
      const lines = buffer.split('\n');
      buffer = lines.pop();
      
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed || trimmed === 'data: [DONE]') continue;
        if (!trimmed.startsWith('data: ')) continue;
        
        try {
          const json = JSON.parse(trimmed.slice(6));
          const delta = json.choices?.[0]?.delta?.content || '';
          full += delta;
          contentEl.classList.add('cursor');
          contentEl.innerHTML = renderMarkdown(full);
          chatEl.scrollTop = chatEl.scrollHeight;
        } catch {}
      }
    }
    
    contentEl.classList.remove('cursor');
    contentEl.innerHTML = renderMarkdown(full);
    chat.messages.push({ role: 'assistant', content: full });
    saveChats();
    
  } catch (err) {
    if (err.name !== 'AbortError') {
      contentEl.innerHTML = '<span style="color:var(--red)">' + escapeHtml(err.message) + '</span>';
    }
  } finally {
    setStreaming(false);
    controller = null;
  }
}

function stopStream() { if (controller) controller.abort(); }

function renderMessage(obj, streaming) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + obj.role;
  
  const av = document.createElement('div');
  av.className = 'avatar ' + (obj.role === 'user' ? 'user' : 'ai');
  av.textContent = obj.role === 'user' ? 'U' : 'L';
  
  const body = document.createElement('div');
  body.className = 'msg-body';
  
  const roleEl = document.createElement('div');
  roleEl.className = 'msg-role';
  roleEl.textContent = obj.role === 'user' ? 'you' : 'lunar';
  
  const contentEl = document.createElement('div');
  contentEl.className = 'msg-content';
  if (streaming) contentEl.classList.add('cursor');
  else contentEl.innerHTML = obj.role === 'user' ? '<p>' + escapeHtml(obj.content) + '</p>' : renderMarkdown(obj.content);
  
  body.appendChild(roleEl);
  body.appendChild(contentEl);
  wrap.appendChild(av);
  wrap.appendChild(body);
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
  
  return { el: wrap, contentEl };
}

function renderMarkdown(text) {
  if (!text) return '';
  let html = text;
  
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, function(match, lang, code) {
    const escaped = escapeHtml(code.trimEnd());
    const langTag = lang ? '<span style="font-family:var(--mono);font-size:10px;color:var(--text-dim);position:absolute;top:6px;left:12px">' + escapeHtml(lang) + '</span>' : '';
    const hasLang = lang ? ';padding-top:28px' : '';
    return '<div class="code-wrap"><pre style="position:relative' + hasLang + '">' + langTag + '<code>' + escaped + '</code></pre><button class="copy-btn" onclick="copyCode(this)">copy</button></div>';
  });
  
  html = html.replace(/`([^`\n]+)`/g, function(m, c) { return '<code>' + escapeHtml(c) + '</code>'; });
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  
  const parts = html.split(/\n{2,}/);
  html = parts.map(function(block) {
    if (block.match(/^<(h[123]|pre|blockquote|table)/)) return block;
    return '<p>' + block.replace(/\n/g, '<br>') + '</p>';
  }).join('\n');
  
  return html;
}

function escapeHtml(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

window.copyCode = function(btn) {
  const code = btn.previousElementSibling.querySelector('code');
  if (!code) return;
  navigator.clipboard.writeText(code.textContent).then(function() {
    btn.textContent = 'copied';
    btn.classList.add('copied');
    setTimeout(function() { btn.textContent = 'copy'; btn.classList.remove('copied'); }, 1500);
  });
};

function setStreaming(v) {
  isStreaming = v;
  document.getElementById('send-icon').style.display = v ? 'none' : 'block';
  document.getElementById('stop-icon').style.display = v ? 'block' : 'none';
  sendBtn.classList.toggle('stop', v);
  inputEl.disabled = v;
}

inputEl.addEventListener('input', function() {
  inputEl.style.height = '';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px';
});

newChatBtn.addEventListener('click', newChat);

loadChats();
</script>
